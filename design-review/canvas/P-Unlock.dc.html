<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlock Cube</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tenshu{--bg:#161716;--panel:#202020;--rail:#111211;--ink:#f5f0e8;--muted:#b9bbb5;--line:#424242;--accent:#f3821d;--selected:#36291e;--good:#8bdfab;--warn:#f3b465;--bad:#ffad9b;--focus:#8fc1ff}
.tenshu.light{--bg:#faf9f6;--panel:#ffffff;--rail:#ede8e0;--ink:#202020;--muted:#575a54;--line:#c4beb4;--selected:#f7e3cc;--good:#23613b;--warn:#77450b;--bad:#8f2e1d;--focus:#1d5fb8}
.tenshu :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tenshu *{animation:none!important;transition:none!important}}
.tenshu.reduced *{animation:none!important;transition:none!important}
a{color:#f3821d}a:hover{color:#ff9a3f}

.tenshu{--on-accent:#1a1208;--accent-ink:#f3821d;font-variant-numeric:tabular-nums}
.tenshu.light{--accent-ink:#8a4304}
.tenshu button,.tenshu input{font:inherit;color:inherit}
.tenshu .sr{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;border:0!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important}
.grow{flex:1}
.uface .dg{width:48px;height:48px;font-size:22px;background:var(--bg)}
.uface .pinrow fieldset{gap:10px}
.uface .eye{width:40px;height:40px}
.muted{color:var(--muted)}
svg{flex:none}
.demo-focus{outline:2px solid var(--focus);outline-offset:2px}

/* top bar: V3-Launcher-Spin chrome, quiet while a Cube is being unlocked */
.top{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--rail)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--muted)}
.brand svg{width:20px;height:20px}
.vsep{width:1px;height:20px;background:var(--line)}
.ctx{font-size:14px;color:var(--muted);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.tenshu a.tbtn{color:var(--muted)}
.tbtn:hover{border-color:var(--line)}
.tbtn svg{width:16px;height:16px}

/* stage: the app's layout, back button top-left, content centred 100px below */
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center}
.backrow{position:absolute;left:48px;top:40px}
.col{margin-top:150px;width:560px;display:flex;flex-direction:column;align-items:center;text-align:center}
.h1{margin:0;font-size:26px;font-weight:600;line-height:1.3}
.netl{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--muted)}
.netl img{width:18px;height:18px;border-radius:50%;display:block}
.tb{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;border:1px solid #d4a62a;font-size:12px;font-weight:500;color:var(--ink)}
.pinrow{display:flex;align-items:center;gap:10px;margin-top:32px}
.pinrow fieldset{display:flex;gap:15px;border:0;margin:0;padding:0}
.dg{width:60px;height:64px;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:center;font-size:28px;font-weight:500}
.dg:focus{border-color:var(--focus)}
.dg[aria-invalid="true"]{border-color:var(--bad)}
.eye{width:50px;height:50px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;color:var(--muted)}
.eye:hover{border-color:var(--line)}
.eye svg{width:20px;height:20px}
.msg{display:flex;align-items:flex-start;gap:8px;margin:20px 0 0;max-width:520px;font-size:14px;color:var(--bad);text-align:left}
.msg svg{width:18px;height:18px;margin-top:1px}
.msg.neutral{color:var(--muted)}
.acts{display:flex;align-items:center;gap:16px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.tenshu a.btn{color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:#ff9a3f;border-color:#ff9a3f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w200{width:200px}
.btn.w280{width:280px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:pointer;font-size:14px}
.tenshu a.linkbtn{color:var(--ink)}
.dots{display:flex;gap:10px;margin-top:24px;height:10px;align-items:center}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.25;animation:pulse 1.5s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.5s}
.dots i:nth-child(3){animation-delay:1s}
.tenshu.reduced .dots i:first-child{opacity:.9}
@keyframes pulse{0%,100%{opacity:.25}33%{opacity:.95}}
.lead{margin:20px 0 0;font-size:15px;color:var(--muted)}

/* simulated system prompt: dashed outline so it never reads as COINCUBE Desktop UI */
.sys{position:absolute;left:50%;top:0;transform:translateX(-50%);width:360px;box-sizing:border-box;padding:20px 22px;border:1.5px dashed var(--muted);border-top:0;border-radius:0 0 12px 12px;background:var(--panel);text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.sys .tag{font-size:12px;color:var(--muted)}
.sys .fp{width:44px;height:44px;margin:12px auto 6px;display:block;color:var(--bad)}
.sys .t{font-weight:600}
.sys .acts{justify-content:center;margin-top:16px}

/* loading (identical for unlock and duress) */
.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:56px}
.art{width:260px;height:260px;object-fit:contain;display:block}
.quote{margin:24px 0 0;max-width:600px}
.quote blockquote{margin:0;font-size:18px;line-height:1.5}
.quote blockquote p{margin:0}
.quote figcaption{margin-top:10px;font-size:13px;color:var(--muted)}
.ltx{margin-top:14px;font-size:14px;color:var(--muted)}
.proto{margin-top:20px;font-size:13px}

.pfoot{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:var(--muted)}
a.brand{color:inherit;text-decoration:none;border-radius:6px}a.brand:hover{color:var(--acc-ink)}
/* shared top bar (Robert, 2026-10-29): the same bar on every screen, Launcher and Cube: 64px on the rail colour; on the right the hide-balances eye, the Connect account chip, then App preferences as an icon with a tooltip. tbx- names keep it clear of page classes. */
.top{height:64px;padding:0 24px;gap:16px;background:var(--rail)}
.tbx-r{display:flex;align-items:center;gap:8px;flex:none}
.tbx-ico{position:relative;width:32px;height:32px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-decoration:none}
.tbx-ico:hover{background:var(--hover,rgba(245,240,232,.06));color:var(--ink)}
.tbx-ico[aria-pressed="true"],.tbx-ico[aria-current="page"]{background:var(--selected);color:var(--ink)}
.tbx-ico svg{width:16px;height:16px}
.tbx-ico[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:13px;font-weight:400;line-height:1.3;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease .25s;z-index:20}
.tbx-ico[data-tip]:hover::after,.tbx-ico[data-tip]:focus-visible::after{opacity:1}
.tbx-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13px;white-space:nowrap;text-decoration:none;cursor:pointer}
a.tbx-chip{color:var(--ink)}
.tbx-chip:hover{background:var(--hover,rgba(245,240,232,.06))}
.tbx-chip[aria-current="page"]{border-color:var(--accent);background:var(--selected)}
.tbx-chip svg{width:16px;height:16px;flex:none}
.tbx-chip .pi{color:var(--muted)}
.tbx-st{display:inline-flex;align-items:center;gap:5px}
.tbx-st.ok{color:var(--good)}.tbx-st.out{color:var(--muted)}.tbx-st.warn{color:var(--warn)}
.tbx-mini{font-weight:600;color:var(--acc-ink,var(--accent))}

/* Closer to Mobile V3 (Robert, 2026-11-25): one-colour wordmark; boxes have no outline; regions keep a quiet dividing line (ink at 10%, as Mobile); menu rows at medium weight; controls keep their outlines. */
.tenshu{--rule:color-mix(in srgb,var(--ink) 10%,transparent)}
.tenshu .top{border-bottom-color:var(--rule)}

/* No artwork (Robert, 2026-11-25): the quote is the centre of the screen. */
.tenshu .quote{margin-top:0}
.tenshu .quote blockquote{font-size:22px;line-height:1.4}

/* ---- V3 Phase 2, folded in from the study page (2026-11-26) ---- */
/* Top bar as the app draws it: [eye, Connect, App preferences]. One Connect control: account glyph with a status light, Connect · account, a chevron; it opens a small panel. */
.tenshu .chips{gap:8px}
.tenshu .ccx{position:relative}
.tenshu .ccx>summary{list-style:none;cursor:pointer}
.tenshu .ccx>summary::-webkit-details-marker{display:none}
.tenshu .chip.cc{gap:7px;padding:0 10px 0 10px}
.tenshu .chip.cc b{font-weight:600}
.tenshu .ccav{position:relative;width:20px;height:20px;display:grid;place-items:center;flex:none}
.tenshu .ccav .lt,.tenshu .cpl .lt{position:absolute;top:-1px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--panel)}
.tenshu .ccsep,.tenshu .ccd{color:var(--muted)}
.tenshu .ccd.si{color:var(--acc-ink);font-weight:600}
.tenshu .cchev{color:var(--muted);transition:transform .15s}
.tenshu .ccx[open] .cchev{transform:rotate(180deg)}
.tenshu .cpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:280px;padding:6px;border-radius:12px;background:var(--panel);box-shadow:0 12px 32px rgba(0,0,0,.35);text-align:left}
.tenshu .cph{display:flex;flex-direction:column;gap:2px;padding:10px 10px 8px}
.tenshu .cph b{font-weight:600;font-size:14px;word-break:break-all}
.tenshu .cph span{color:var(--muted);font-size:13px}
.tenshu .cpl{position:relative;display:flex;align-items:center;gap:8px;padding:2px 10px 10px 24px;font-size:13px;color:var(--muted)}
.tenshu .cpl .lt{left:10px;right:auto;top:6px;box-shadow:none}
.tenshu .cpr{height:1px;margin:0 4px 4px;background:var(--rule,var(--line))}
.tenshu .cpa{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px}
.tenshu .cpa:hover{background:var(--hover,var(--selected))}
/* Hide balances: neutral when on. */
.tenshu .top .chips .eye[aria-pressed="true"]{border-color:transparent;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
/* Sidebar backup strip: one line, a dot, no box. */
.tenshu .attn{border:0;background:transparent;gap:9px;padding:8px 10px;font-size:13px}
.tenshu .attn>svg,.tenshu .attn .st>svg{display:none}
.tenshu .attn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.tenshu .attn .warn,.tenshu .attn .st{color:var(--ink);font-weight:500}
.tenshu .attn .go{color:var(--muted);font-weight:400}
.tenshu .attn:hover{background:var(--hover,var(--selected))}

/* V3 (2026-11-26): the app's unlock face (420px, edge in the network colour), Launcher Connect control */
.uface{position:relative;margin-top:110px;width:420px;height:420px;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid rgba(243,130,29,.6)}
.uface.b2b{border-color:rgba(212,166,42,.6)}
.uh{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.uface .netl{margin-top:8px}
.flab{margin:24px 0 6px;font-size:13px;font-weight:500}
.uface .pinrow{margin-top:0}
.help{margin:6px 0 0;font-size:12px;color:var(--muted)}
.uface .msg{margin:6px 0 0;font-size:12px;color:var(--bad);max-width:360px}
.uface .acts{margin-top:20px}
.uface .lead{margin-top:28px;font-size:14px;text-align:left}
.grow{flex:1}
.tenshu .chip.cc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.tenshu .chip.cc b{font-weight:600}
.tenshu .ccav{position:relative;width:20px;height:20px;display:grid;place-items:center;flex:none}
.tenshu .ccav svg{width:16px;height:16px;color:var(--muted)}
.tenshu .ccav .lt{position:absolute;top:-1px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--rail)}
.tenshu .ccsep,.tenshu .ccd{color:var(--muted)}
.tenshu .ccd.si{color:var(--accent);font-weight:600}
/* cc-buttons v1 */
/* One button language (Robert, 2026-11-26).
   In a bar (top bar, side menu, Launcher bottom bar): no outline. Buttons there are quiet, like the side menu rows:
   hover is a light fill, an open menu keeps it, and the current item or an active filter has the selected fill.
   In page content: every button is outlined (text or icon only), 1 px in the text colour (ink), radius 8px, as on Mobile; hover adds a light fill.
   Primary is filled accent wherever it sits, once per view. Text links and the close x in a toast or dialog corner have no box. */
.tenshu{--hover:rgba(245,240,232,.06)}
.tenshu.light{--hover:rgba(32,32,32,.05)}
.tenshu :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.pgbtn,.sb){border-radius:8px}
.tenshu :is(.pill.out,.back,.sb){background:transparent;color:var(--ink)}
.tenshu .phead .hact .back:not(:hover){background:transparent}
.tenshu :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.pgbtn,.pill,.back,.sb):not(:is(.primary,.fill,.pri,.npri)):not(.danger):not(.on):not([aria-pressed="true"]):not(:is(.top,.side,.bottom) *){border:1px solid var(--ink)}
.tenshu :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.pill,.back,.sb):not(:is(.primary,.fill,.pri,.npri,.danger)):not(.on):not([aria-pressed="true"]):not(:disabled):not(:is(.top,.side,.bottom) *):is(:hover,[aria-expanded="true"]){background:var(--hover);border-color:var(--ink)}
.tenshu .btn.danger:not(:disabled):hover{background:var(--hover);color:var(--bad)}
.tenshu .pgbtn:not([disabled]):hover{background:var(--hover);border-color:var(--ink)}
.tenshu :is(.top,.side,.bottom) :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.tbx-ico,.eye,.sb):not(:is(.primary,.pri,.npri)){border:1px solid transparent;border-radius:8px;background:transparent}
.tenshu :is(.top,.side,.bottom) :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.tbx-ico,.eye,.sb):not(:is(.primary,.pri,.npri)):not(:disabled):is(:hover,[aria-expanded="true"]){background:var(--hover);border-color:transparent;color:var(--ink)}
.tenshu :is(.top,.side,.bottom) :is(.btn,.chip,.planbtn,.srcbtn,.keybtn,.tbtn,.tbx-ico,.eye,.sb):not(:is(.primary,.pri,.npri)):is(.on,[aria-pressed="true"],[aria-current="page"]){background:var(--selected);border-color:transparent;color:var(--ink)}
.tenshu .top :is(.tbx-ico,.eye){width:32px;height:32px;box-sizing:border-box}
.tenshu :is(.planbtn,.srcbtn,.keybtn){height:36px;padding:0 12px}
/* Primary: filled accent with a 1 px accent edge, dark label. Hover brightens the fill; disabled dims it and hover does nothing. */
.tenshu :is(.btn,.pill,.oprim):is(.primary,.fill,.pri,.npri),.tenshu .oprim{background:var(--accent);border:1px solid var(--accent);color:#1a1208}
.tenshu :is(.btn,.pill):is(.primary,.fill,.pri,.npri):not(:disabled):hover,.tenshu .oprim:not(:disabled):hover{background:#ff9a3f;border-color:#ff9a3f;color:#1a1208}
.tenshu :is(.btn,.pill,.oprim):disabled{opacity:.45;cursor:not-allowed}
/* Content dropdowns, filter chips and small icon or text buttons follow the same outline. */
.tenshu :is(.mx-chip,.netchip,.flip,.nmax,.tg){border:1px solid var(--ink)}
.tenshu .nmax{border-radius:8px}
.tenshu :is(.mx-chip,.netchip,.flip,.nmax,.tg):not(:disabled):is(:hover,[aria-expanded="true"]){border-color:var(--ink);background:var(--hover)}
.tenshu .tg[aria-pressed="true"]{border-color:var(--ink);background:var(--selected)}
/* Notices and toasts, option D (Robert, 2026-11-27): a warning or an error washes its panel 8% in its tone; no tone edge. Info and success stay plain. */
.tenshu .nt.t-warn{--tone:var(--warn)} .tenshu .nt.t-bad{--tone:var(--bad)}
.tenshu .nt:is(.t-warn,.t-bad){background:color-mix(in srgb,var(--tone) 8%,var(--panel))}
.tenshu .nt .na{border-width:1px}
.tenshu .cc-toast.t-warn.t-warn{border-color:var(--line);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.tenshu .cc-toast.t-bad.t-bad{border-color:var(--line);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
</style>
</helmet>
<div class="tenshu {{themeClass}} {{motionClass}}" style="width:1440px;height:900px;box-sizing:border-box;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg);display:flex;flex-direction:column">

  <header class="top">
    <a class="brand" href="P-Launcher.dc.html" title="Back to the Launcher">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg>
      <span><span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;line-height:1;letter-spacing:.08em;color:var(--ink)">COINCUBE</span></span>
    </a>
    <span class="grow"></span>
    <div class="tbx-r"><sc-if value="{{ acctIn }}" hint-placeholder-val="{{ true }}"><a class="chip cc" href="P-Connect.dc.html" aria-label="Connect account, alex@example.test, signed in"><span class="ccav"><svg aria-hidden="true" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6.5" r="3"/><path d="M3.5 15.5c.8-2.8 2.9-4.25 5.5-4.25s4.7 1.45 5.5 4.25"/></svg><i class="lt"></i></span><b>Connect</b><span class="ccsep" aria-hidden="true">·</span><span class="ccd">alex@example.test</span></a></sc-if><sc-if value="{{ acctOut }}" hint-placeholder-val="{{ false }}"><a class="chip cc" href="P-Connect.dc.html" aria-label="Connect: Sign in"><span class="ccav"><svg aria-hidden="true" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6.5" r="3"/><path d="M3.5 15.5c.8-2.8 2.9-4.25 5.5-4.25s4.7 1.45 5.5 4.25"/></svg></span><b>Connect</b><span class="ccsep" aria-hidden="true">·</span><span class="ccd si">Sign in</span></a></sc-if><a class="tbx-ico" href="P-AppPrefs.dc.html" aria-label="App preferences" data-tip="App preferences"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a></div>
  </header>

  <main class="stage" aria-busy="{{ busy }}">

    <!-- LOADING: same screen for a correct PIN, a duress PIN and a passkey success -->
    <sc-if value="{{ v.loading }}" hint-placeholder-val="{{ false }}">
      <div class="load">
        <h1 class="sr">Opening {{ cube.name }}</h1>
        <figure class="quote">
          <blockquote><p>Bitcoin is the hardest money ever invented: growth in its value cannot possibly increase its supply.</p></blockquote>
          <figcaption>— Saifedean Ammous, The Bitcoin Standard, 2018</figcaption>
        </figure>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="ltx" role="status">Loading your Cube...</p>
        <a class="linkbtn proto" href="P-Opening.dc.html">Continue</a>
      </div>
    </sc-if>

    <sc-if value="{{ v.form }}" hint-placeholder-val="{{ true }}">
      <!-- the unlock face as the app draws it without the 3D floor (List mode or no 3D renderer): a lone face, Cancel pinned at its foot -->
      <section class="uface {{ cube.edge }}" aria-labelledby="uf-t">
        <h1 class="uh" id="uf-t">Open {{ cube.name }}</h1>
        <p class="netl">
          <sc-if value="{{ cube.btc }}" hint-placeholder-val="{{ true }}"><img src="/_blob/dbbfc88f16f7cc27510d81f434c268ea" alt=""></sc-if>
          <sc-if value="{{ cube.b2b }}" hint-placeholder-val="{{ false }}"><img src="/_blob/c39785504daaef5633099a8ae196c784" alt=""></sc-if>
          <span>{{ cube.net }}</span>
        </p>

        <!-- PIN -->
        <sc-if value="{{ v.pin }}" hint-placeholder-val="{{ true }}">
          <p class="flab" id="pin-l">PIN</p>
          <div class="pinrow">
            <fieldset aria-labelledby="pin-l">
              <sc-for list="{{ digits }}" as="d" hint-placeholder-count="4">
                <input class="dg {{ d.cls }}" type="{{ pinType }}" inputmode="numeric" autocomplete="off" maxLength="1" aria-label="{{ d.label }}" aria-invalid="{{ invalid }}" aria-describedby="unlock-help unlock-msg" value="{{ d.val }}" onChange="{{ d.set }}" disabled="{{ checking }}">
              </sc-for>
            </fieldset>
            <button type="button" class="eye" aria-pressed="{{ showPressed }}" aria-label="Show PIN" onClick="{{ toggleShow }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ eyePath }}"></path></svg>
            </button>
          </div>
          <p class="help" id="unlock-help">{{ pinHelp }}</p>
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}">
            <p class="msg" id="unlock-msg" role="alert">{{ msg }}</p>
          </sc-if>
          <div class="acts">
            <button type="button" class="btn primary" disabled="{{ submitOff }}" onClick="{{ submit }}">{{ unlockLabel }}</button>
          </div>
        </sc-if>

        <!-- PASSKEY: no explanatory line while idle (passkey_unlock.rs:534-546) -->
        <sc-if value="{{ v.passkey }}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{ v.waiting }}" hint-placeholder-val="{{ false }}">
            <p class="lead" role="status">Confirm with Touch ID to unlock this Cube.</p>
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
          </sc-if>
          <sc-if value="{{ v.idle }}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}">
              <p class="msg" id="unlock-msg" role="alert">{{ msg }}</p>
            </sc-if>
            <div class="acts">
              <button type="button" class="btn primary" onClick="{{ begin }}">Unlock with passkey</button>
            </div>
          </sc-if>
        </sc-if>
        <span class="grow"></span>
        <a class="linkbtn" href="P-Launcher.dc.html">Cancel</a>
      </section>

      <sc-if value="{{ v.waiting }}" hint-placeholder-val="{{ false }}">
        <section class="sys" aria-labelledby="sys-t">
          <p class="tag">Simulated macOS prompt</p>
          <svg class="fp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7.5 5.6A8 8 0 0 1 20 12v1.5M4 12a8 8 0 0 1 1.3-4.4M8 19.5a12 12 0 0 1-1-5.5 5 5 0 0 1 10 0v.5M12 14v1.5c0 2 .6 3.8 1.6 5.3M16.8 18.5c.1-.8.2-1.7.2-2.5"></path></svg>
          <p class="t" id="sys-t">Touch ID</p>
          <div class="acts">
            <button type="button" class="btn" onClick="{{ sysCancel }}">Cancel</button>
            <button type="button" class="btn primary" onClick="{{ sysOk }}">Approve</button>
          </div>
        </section>
      </sc-if>
    </sc-if>

    <p class="pfoot">{{ foot }}</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"method":{"editor":"enum","options":["pin","passkey"],"default":"pin","section":"Review"},"state":{"editor":"enum","options":["ready","incomplete","checking","wrong","lockout","keychain","failed","signedOut","waiting","cancelled","notFound","relocked","otherOs","loading","duress"],"default":"ready","section":"Review"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Review"},"reducedMotion":{"editor":"boolean","default":false,"section":"Review"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); try { const bump = () => { try { this.setState({ protoTick: Date.now() }); } catch (e) {} }; window.addEventListener('tenshu-proto', bump); window.addEventListener('storage', bump); } catch (e) {} this.state = { lv: null }; }
  renderVals() {
    // prototype-only: Appearance (App preferences) is a device setting shared across artboards: system follows the review lever
    let THEME = 'system'; try { THEME = localStorage.getItem('tenshu.proto.theme') || 'system'; } catch (e) {}
    const P = this.props;
    const theme = P.theme ?? 'dark';
    const method = P.method === 'passkey' ? 'passkey' : 'pin';
    const lever = P.state || 'ready';
    // each method has its own states; a state the other method owns falls back to "ready"
    const PIN = ['ready', 'incomplete', 'checking', 'wrong', 'lockout', 'keychain', 'failed', 'signedOut', 'loading', 'duress'];
    const PK = ['ready', 'waiting', 'cancelled', 'notFound', 'relocked', 'otherOs', 'loading'];
    const own = method === 'pin' ? PIN : PK;
    const st0 = own.indexOf(lever) >= 0 ? lever : 'ready';
    const key = method + '|' + st0;
    const filled = st0 === 'incomplete' ? ['4', '7', '', ''] : st0 === 'checking' ? ['4', '7', '1', '9'] : ['', '', '', ''];
    const s = this.state.lv !== key ? { st: st0, d: filled, show: false } : this.state;
    const go = (patch) => this.setState(Object.assign({}, s, { lv: key }, patch));

    // source: pin_entry.rs (PIN), services/unlock/throttle.rs (lockout), passkey_unlock.rs + services/passkey/mod.rs user_message (passkey)
    const MSG = {
      incomplete: 'Please enter all 4 digits',
      wrong: 'Incorrect PIN. Please try again.',
      lockout: 'Too many incorrect PINs. Try again in 30s.',
      failed: 'PIN check failed to run: [synthetic error]',
      keychain: "Part of this Cube's encryption key was stored in this computer's system keychain, and it's no longer there. Your PIN alone can't open it. Restore this Cube from its Recovery Kit.",
      signedOut: 'Sign in to Connect before unlocking this Bitcoin Blake2b Cube',
      cancelled: "Touch ID was cancelled, so this Cube stayed locked. Your Cube and its funds are untouched — try again when you're ready.",
      notFound: "This Mac couldn't find this Cube's passkey. Sign in to the Apple ID that created it (with iCloud Keychain on), or restore this Cube from your Recovery Kit and its recovery password. The Cube itself is fine.",
      relocked: 'This Cube locked again before it finished opening. Unlock it with your passkey to try again.',
      otherOs: 'This Cube is unlocked with a passkey, which COINCUBE currently supports on macOS only. Open it on your Mac, or restore it here from your Recovery Kit and its recovery password.'
    };
    const st = s.st;
    const blake = method === 'pin' && st === 'signedOut';
    const cube = blake
      ? { name: 'Blake workspace', net: 'Bitcoin Blake2b mainnet', btc: false, b2b: true, edge: 'b2b' }
      : method === 'passkey' ? { name: 'Travel fund', net: 'Bitcoin mainnet', btc: true, b2b: false, edge: 'btc' }
      : { name: 'Everyday', net: 'Bitcoin mainnet', btc: true, b2b: false, edge: 'btc' };
    const loading = st === 'loading' || st === 'duress';
    const checking = st === 'checking';
    const msg = MSG[st] || '';

    const digits = s.d.map((val, i) => ({
      val,
      label: 'PIN digit ' + (i + 1),
      cls: (i === 0 && st === 'ready' && method === 'pin') ? 'demo-focus' : '',
      set: (e) => {
        const raw = e && e.target ? String(e.target.value) : '';
        const v = raw.replace(/[^0-9]/g, '').slice(-1);
        const next = s.d.slice(); next[i] = v;
        // typing clears the error, as PinInput does
        go({ d: next, st: (st === 'loading' || st === 'duress' || st === 'checking') ? st : 'ready' });
      }
    }));
    const complete = s.d.every((x) => x !== '');

    const EYE_OPEN = 'M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6';
    const EYE_SHUT = 'M9.9 5.8A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.6 3.4M6.4 7.4C3.9 9.1 2.5 12 2.5 12S6 18.5 12 18.5c1.8 0 3.3-.5 4.6-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2M4 4l16 16';

    const FOOT = {
      duress: 'Prototype · synthetic data · duress PIN: this screen and its timing match a normal unlock, then the Cube locks into duress mode',
      loading: 'Prototype · synthetic data · Continue stands in for the wallet load; the app moves on by itself',
      waiting: 'Prototype · synthetic data · the dashed prompt stands in for the macOS passkey sheet'
    };

    return {
      themeClass: this.props.forceTheme ? (this.props.forceTheme === 'light' ? 'light' : '') : ((THEME === 'light' || (THEME !== 'dark' && theme === 'light')) ? 'light' : ''),
      motionClass: P.reducedMotion ? 'reduced' : '',
      who: blake ? 'Sign in' : 'alex@example.test', acctIn: !blake, acctOut: blake,
      busy: loading || st === 'waiting' ? 'true' : 'false',
      cube,
      checking, pinHelp: checking ? 'Checking your PIN\u2026' : "Enter this Cube's PIN.", unlockLabel: checking ? 'Unlocking\u2026' : 'Unlock',
      v: {
        loading,
        form: !loading,
        pin: method === 'pin',
        passkey: method === 'passkey',
        waiting: method === 'passkey' && st === 'waiting',
        idle: method === 'passkey' && st !== 'waiting',
        signIn: blake
      },
      digits,
      pinType: s.show ? 'text' : 'password',
      showPressed: s.show ? 'true' : 'false',
      eyePath: s.show ? EYE_SHUT : EYE_OPEN,
      toggleShow: () => go({ show: !s.show }),
      invalid: (st === 'wrong' || st === 'incomplete') ? 'true' : 'false',
      hasMsg: !!msg,
      msg,
      submitOff: !complete || checking,
      // "Checking your PIN…" / "Unlocking…", then the Cube opens (P-Opening); a wrong PIN returns here with the digits cleared
      submit: () => { if (!complete) return; go({ st: 'checking' }); clearTimeout(this._ck); this._ck = setTimeout(() => { try { window.location.href = 'P-Opening.dc.html'; } catch (e) {} }, 900); },
      begin: () => go({ st: 'waiting' }),
      sysCancel: () => go({ st: 'cancelled' }),
      sysOk: () => go({ st: 'loading' }),
      foot: FOOT[st] || 'Prototype · synthetic data · the unlock face without the 3D floor (List mode); copy quoted from the app; Cancel returns to the Launcher'
    };
  }
}
